# Configuración de pytest.
# pythonpath = src  -> permite que las pruebas importen directamente, por ejemplo "from fase1 import bfs",
#                      sin tener que mover archivos ni modificar sys.path.
# testpaths = tests -> le indica a pytest que solo busque pruebas dentro de la carpeta tests/.
[pytest]
pythonpath = src
testpaths = tests
